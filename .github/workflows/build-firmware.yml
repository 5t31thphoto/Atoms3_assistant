name: Build Fox Firmware

on:
push:
branches: [main, master]
pull_request:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Install Python test dependencies
    run: python3 -m pip install --upgrade pytest

  - name: Test offline command registry
    run: python3 -m pytest -q tests

  - name: Build ESP-IDF firmware
    uses: espressif/esp-idf-ci-action@v1
    with:
      esp_idf_version: v5.5.5
      target: esp32s3
      path: firmware

  - name: Verify ESP-IDF environment
    shell: bash
    run: |
      set -euo pipefail

      echo "ESP-IDF version:"
      idf.py --version

      IDF_VERSION="$(idf.py --version | sed -n 's/.*v\([0-9.]*\).*/\1/p')"
      test "$IDF_VERSION" = "5.5.5"

      echo "Checking MALLOC_CAP_SIMD..."
      grep -q "MALLOC_CAP_SIMD" \
        "$IDF_PATH/components/heap/include/esp_heap_caps.h"

  - name: Verify partition artifacts
    shell: bash
    run: |
      set -euo pipefail

      test -s firmware/build/fox_voice_assistant.bin
      test -s firmware/build/bootloader/bootloader.bin
      test -s firmware/build/partition_table/partition-table.bin

      # ESP-SR model image generated during the IDF build.
      test -s firmware/build/srmodels/srmodels.bin

      # PicoTTS language resources generated by the component build.
      test -s firmware/build/esp-idf/picotts/picotts_ta.bin
      test -s firmware/build/esp-idf/picotts/picotts_sg.bin

  - name: Report artifact sizes
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Firmware ==="
      ls -lh firmware/build/fox_voice_assistant.bin

      echo "=== ESP-SR model ==="
      ls -lh firmware/build/srmodels/srmodels.bin

      echo "=== PicoTTS ==="
      ls -lh \
        firmware/build/esp-idf/picotts/picotts_ta.bin \
        firmware/build/esp-idf/picotts/picotts_sg.bin

  - name: Package release
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p release

      cp firmware/build/fox_voice_assistant.bin \
        release/fox-app.bin

      cp firmware/build/bootloader/bootloader.bin \
        release/bootloader.bin

      cp firmware/build/partition_table/partition-table.bin \
        release/partition-table.bin

      cp firmware/build/srmodels/srmodels.bin \
        release/srmodels.bin

      cp firmware/build/esp-idf/picotts/picotts_ta.bin \
        release/picotts_ta.bin

      cp firmware/build/esp-idf/picotts/picotts_sg.bin \
        release/picotts_sg.bin

      cp firmware/partitions.csv \
        release/partitions.csv

      cp firmware/build/flash_args \
        release/flash_args.txt

      sha256sum release/* > release/SHA256SUMS.txt

  - uses: actions/upload-artifact@v4
    with:
      name: fox-offline-firmware
      path: release/
```
