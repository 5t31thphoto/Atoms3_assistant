name: Build Fox Firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # All run: steps start in the repo root (GHA checkout root). No subdir.
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tree
        run: |
          echo "workspace=${{ github.workspace }}"
          ls -la
          test -f firmware/CMakeLists.txt && echo "OK: firmware/CMakeLists.txt" || echo "MISSING: firmware/CMakeLists.txt"
          test -f firmware/main/main.c && echo "OK: firmware/main/main.c" || echo "MISSING: main.c"

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware

      - name: List build outputs
        if: always()
        run: |
          # NO working-directory key — stay at repo root
          if [ -d firmware/build ]; then
            ls -la firmware/build/
            ls -la firmware/build/*.bin 2>/dev/null || echo "no .bin files"
          else
            echo "no firmware/build yet"
            ls -la firmware 2>/dev/null || echo "no firmware dir"
          fi

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fox-firmware
          path: firmware/build/*.bin
          if-no-files-found: warn
