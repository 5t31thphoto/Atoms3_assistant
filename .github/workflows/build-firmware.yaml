name: Build Fox Firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test offline command registry
        run: python3 -m pytest -q tests

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Verify ESP-IDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          idf.py --version
          test "$(idf.py --version)" = "ESP-IDF v5.5.5"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("$IDF_PATH/components/heap/include/esp_heap_caps.h")
          text = p.read_text()
          assert "#define MALLOC_CAP_SIMD" in text, f"MALLOC_CAP_SIMD missing from {p}"
          print(f"Verified MALLOC_CAP_SIMD in {p}")
          PY

      - name: Configure ESP32-S3
        working-directory: firmware
        run: idf.py set-target esp32s3

      - name: Build ESP-IDF firmware
        working-directory: firmware
        run: idf.py build

      - name: Verify partition artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware/build/fox_voice_assistant.bin
          test -s firmware/build/bootloader/bootloader.bin
          test -s firmware/build/partition_table/partition-table.bin
          test -s firmware/build/srmodels/srmodels.bin
          test -s firmware/build/esp-idf/picotts/picotts_ta.bin
          test -s firmware/build/esp-idf/picotts/picotts_sg.bin

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp firmware/build/fox_voice_assistant.bin release/fox-app.bin
          cp firmware/build/bootloader/bootloader.bin release/bootloader.bin
          cp firmware/build/partition_table/partition-table.bin release/partition-table.bin
          cp firmware/build/srmodels/srmodels.bin release/srmodels.bin
          cp firmware/build/esp-idf/picotts/picotts_ta.bin release/picotts_ta.bin
          cp firmware/build/esp-idf/picotts/picotts_sg.bin release/picotts_sg.bin
          cp firmware/partitions.csv release/partitions.csv
          cp firmware/build/flash_args release/flash_args.txt
          sha256sum release/* > release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fox-offline-firmware
          path: release/
