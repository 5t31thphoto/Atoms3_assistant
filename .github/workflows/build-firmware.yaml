name: Build Fox Firmware

on:
  workflow_dispatch:
    inputs:
      config_json:
        description: "JSON config from the web flasher"
        required: true
        type: string
      fox_name:
        description: "Fox name (fallback)"
        required: false
        default: "Ember"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Write config
        run: |
          mkdir -p firmware/main/generated
          echo '${{ github.event.inputs.config_json }}' > firmware/main/generated/user_config.json
          # Simple header generation (expand later)
          python3 - << 'EOF'
          import json, os
          cfg = json.loads(open("firmware/main/generated/user_config.json").read())
          name = cfg.get("fox", {}).get("name", "Ember")
          with open("firmware/main/generated/config.h", "w") as f:
              f.write("#pragma once\n")
              f.write(f'#define FOX_NAME "{name}"\n')
              f.write(f'#define FOX_MODE "{cfg.get("mode", "groq")}"\n')
              primary = cfg.get("fox", {}).get("colorPrimary", "#ff6b35")
              f.write(f'#define FOX_COLOR_PRIMARY "{primary}"\n')
          print("Generated config.h")
          EOF

      - name: Build
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Create merged binary
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          # Produce a single flashable image (bootloader + partitions + app)
          # Adjust offsets to match your partition table
          esptool.py --chip esp32s3 merge_bin -o build/fox-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 8MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/fox_voice_assistant.bin || true
          # Fallback name if project binary differs
          ls -la build/*.bin || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fox-firmware
          path: |
            firmware/build/*.bin
            firmware/build/flasher_args.json
            firmware/main/generated/

      - name: Publish to Pages (optional)
        if: success()
        run: |
          mkdir -p pages/builds/${{ github.run_id }}
          cp firmware/build/fox-merged.bin pages/builds/${{ github.run_id }}/ 2>/dev/null || true
          # Create a simple manifest for ESP Web Tools
          cat > pages/builds/${{ github.run_id }}/manifest.json << MANIFEST
          {
            "name": "Fox Voice Assistant",
            "version": "${{ github.run_id }}",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "fox-merged.bin", "offset": 0 }
                ]
              }
            ]
          }
          MANIFEST
          echo "Publish the pages/ folder with GitHub Pages or a second job."
