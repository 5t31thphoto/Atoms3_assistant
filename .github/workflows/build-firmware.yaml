name: Build Fox Firmware

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      config_json:
        description: "JSON config from web flasher (optional)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # REQUIRED: expand fox-overlay.zip from repo root before anything else
      # ------------------------------------------------------------------
      - name: Expand overlay zip
        run: |
          set -euo pipefail
          echo "=== Workspace before unzip ==="
          ls -la
          if [ ! -f fox-overlay.zip ]; then
            echo "::error::fox-overlay.zip not found at repo root. Commit the overlay zip."
            exit 1
          fi
          echo "Expanding fox-overlay.zip (overwrite existing files, keep extras)..."
          unzip -o fox-overlay.zip -d .
          echo "=== Workspace after unzip ==="
          ls -la
          echo "=== Looking for firmware sources ==="
          if [ ! -f firmware/main/main.c ]; then
            echo "::error::firmware/main/main.c missing after unzip. Overlay zip is wrong or empty."
            find . -type f | head -80
            exit 1
          fi
          echo "Overlay OK — firmware/main/main.c present"
          find firmware -type f | sort

      - name: Write optional runtime config
        if: ${{ github.event.inputs.config_json != '' }}
        run: |
          mkdir -p firmware/main/generated
          echo '${{ github.event.inputs.config_json }}' > firmware/main/generated/user_config.json
          python3 - << 'PY'
          import json, os
          path = "firmware/main/generated/user_config.json"
          if not os.path.exists(path):
              raise SystemExit(0)
          cfg = json.loads(open(path).read())
          name = cfg.get("fox", {}).get("name", "Ember")
          mode = cfg.get("mode", "groq")
          primary = cfg.get("fox", {}).get("colorPrimary", "#ff6b35")
          with open("firmware/main/generated/config.h", "w") as f:
              f.write("#pragma once\n")
              f.write(f'#define FOX_NAME "{name}"\n')
              f.write(f'#define FOX_MODE "{mode}"\n')
              f.write(f'#define FOX_COLOR_PRIMARY "{primary}"\n')
          print("Generated config.h")
          PY

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: firmware

      - name: List build outputs
        if: always()
        working-directory: firmware
        run: |
          ls -la build/ 2>/dev/null || echo "no build dir"
          ls -la build/*.bin 2>/dev/null || true

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fox-firmware
          path: |
            firmware/build/*.bin
            firmware/build/flasher_args.json
            firmware/main/generated/
          if-no-files-found: warn
